<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCBC PayNow - Choose Recipient</title>

    <!-- Existing PayNow CSS -->
    <link rel="stylesheet" href="../css/paynow.css">

    <!-- Guided Mode -->
    <link rel="stylesheet" href="../css/guided-mode.css">

    <!-- Voice Assistance CSS -->
    <link rel="stylesheet" href="../css/voiceAssistance.css">

    <!-- Existing PayNow JS -->
    <script src="../scripts/paynow_sent.js" defer></script>

    <!-- Guided Mode JS -->
    <script type="module" src="../scripts/app.js"></script>

    <!-- Voice Assistance JS -->
    <script src="../scripts/voiceAssistance.js" defer></script>
</head>


<body data-page="paynowSent">
    <main class="phone-screen paynow-page">

        <!-- Header -->
        <header class="header">
            <button class="back-button" id="backButton" aria-label="Go back">
                ‹
            </button>
            <h1>PayNow</h1>
        </header>

        <!-- Progress bar -->
        <div class="progress-container">
            <div class="progress-bar active"></div>
            <div class="progress-bar"></div>
            <div class="progress-bar"></div>
            <div class="progress-bar"></div>
        </div>

        <section class="content">

            <!-- Step information -->
            <div class="step-row">
                <p class="step-title">
                    <span>Step 1 of 4</span> · Choose who to pay
                </p>

                <button type="button" class="ask-button" id="askBtn">
                    Ask OCBC
                </button>
            </div>
            
            <!-- Payment options -->
            <div class="payment-types">
                <button type="button" class="payment-option" data-type="nric">
                    <img src="../images/nric-icon.png"
                    class="payment-icon" alt="">
                    <span>NRIC/FIN</span>
                </button>
                
                <button type="button" class="payment-option" data-type="uen">
                    <img src="../images/uen-icon.png"
                    class="payment-icon" alt="">
                    <span>UEN/VPA</span>
                </button>
            </div>

            <!-- Search -->
            <div class="search-section">
                <label for="searchInput">Who are you sending to?</label>

                <div class="search-box">
                    <span class="search-icon">⌕</span>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search by name or mobile number"
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- Recent / Contacts -->
            <div class="tabs">
                <button type="button" class="tab active" data-tab="recent">
                    Recent
                </button>
                <button type="button" class="tab" data-tab="contacts">
                    Contacts
                </button>
            </div>

            <!-- Database recipients -->
            <div class="recipient-content" id="recipientContent" aria-live="polite">
                 <!-- No recent transfers message -->
                  <div class="empty-state" id="emptyRecentState">
                    <img
                    src="../images/paynow-no-recent-icon.png"
                    alt=""
                    class="empty-state-icon">

                    <h3>No recent PayNow transfers</h3>
                    
                    <p>Your 10 most recent payees will be shown here.</p>
                </div>
            </div>

        </section>

        <!-- Bottom button -->
        <div class="bottom-section">
            <div class="button-container">
                <button type="button" class="help-button" id="helpBtn">
                    Need help?
                </button>
            </div>
        </div>

    </main>
</body>
</html>
