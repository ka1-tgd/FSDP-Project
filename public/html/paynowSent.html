
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCBC PayNow - Choose Recipient</title>

    <!-- PayNow CSS -->
    <link rel="stylesheet" href="../css/paynow.css">

    <!-- Guided Mode CSS -->
    <link rel="stylesheet" href="../css/guided-mode.css">

    <!-- Voice Assistance CSS -->
    <link rel="stylesheet" href="../css/voiceAssistance.css">

    <!-- Language JS -->
    <script src="../scripts/paynowStep1Language.js" defer></script>

    <!-- PayNow JS -->
    <script src="../scripts/paynow_sent.js" defer></script>

    <!-- Guided Mode JS -->
    <script type="module" src="../scripts/guidedModeApp.js"></script>

    <!-- Voice Assistance JS -->
    <script src="../scripts/voiceAssistance.js" defer></script>

    <!-- Error Popup JS -->
    <script src="../scripts/errorPopup.js" defer></script>
</head>

<body data-page="paynowSent">

    <main class="phone-screen paynow-page">

        <!-- Header -->
        <header class="header">

            <a href="ocbcHome.html"
               class="back-button"
               aria-label="Go back"
               data-i18n-aria="goBack">
                ‹
            </a>

            <h1>PayNow</h1>

        </header>

        <!-- Progress bar -->
        <div class="progress-container">
            <div class="progress-bar active"></div>
            <div class="progress-bar"></div>
            <div class="progress-bar"></div>
            <div class="progress-bar"></div>
        </div>

        <!-- Main content -->
        <section class="content">

            <!-- Step information -->
            <div class="step-heading">

                <p class="step-title">
                    <span data-i18n="step">Step 1 of 4</span>
                    ·
                    <span data-i18n="chooseRecipient">
                        Choose who to pay
                    </span>
                </p>

                <button
                    type="button"
                    class="guided-help-button"
                    id="guidedHelpBtn"
                    aria-label="Show guidance"
                    data-i18n-aria="showGuidance"
                    aria-expanded="false">
                    ?
                </button>

            </div>

            <!-- Payment options -->
            <div class="payment-types">

                <button
                    type="button"
                    class="payment-option"
                    data-type="nric">

                    <img
                        src="../images/nric-icon.png"
                        class="payment-icon"
                        alt="">

                    <span>NRIC/FIN</span>
                </button>

                <button
                    type="button"
                    class="payment-option"
                    data-type="uen">

                    <img
                        src="../images/uen-icon.png"
                        class="payment-icon"
                        alt="">

                    <span>UEN/VPA</span>
                </button>

            </div>

            <!-- Search -->
            <div class="search-section">

                <label
                    for="searchInput"
                    data-i18n="whoToPay">
                    Who are you sending to?
                </label>

                <div class="search-box">

                    <span class="search-icon">⌕</span>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search by name or mobile number"
                        data-i18n-placeholder="searchPlaceholder"
                        autocomplete="off"
                        aria-label="Open recipient search"
                        data-i18n-aria="openSearch"
                        readonly>

                </div>

            </div>

            <!-- Recent and Contacts -->
            <div class="tabs">

                <button
                    type="button"
                    class="tab active"
                    data-tab="recent"
                    data-i18n="recent">
                    Recent
                </button>

                <button
                    type="button"
                    class="tab"
                    data-tab="contacts"
                    data-i18n="contacts">
                    Contacts
                </button>

            </div>

            <!-- Database recipients -->
            <div
                class="recipient-content"
                id="recipientContent"
                aria-live="polite">

                <!-- Default recent state -->
                <div
                    class="empty-state"
                    id="emptyRecentState">

                    <img
                        src="../images/paynow-no-recent-icon.png"
                        alt=""
                        class="empty-state-icon">

                    <h3
                        class="empty-title"
                        data-i18n="noRecent">
                        No recent PayNow transfers
                    </h3>

                    <p
                        class="empty-subtitle"
                        data-i18n="recentDescription">
                        Your 10 most recent payees will be shown here.
                    </p>

                </div>

            </div>

               </section>

    </main>

    <!-- Accessibility JS -->
    <script src="../scripts/accessibility.js"></script>

</body>
</html>
