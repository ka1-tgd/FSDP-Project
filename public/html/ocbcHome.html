
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCBC Home</title>

    <link rel="stylesheet" href="../css/paynow.css">
    <link rel="stylesheet" href="../css/ocbcHome.css">

    <!-- Load translations before Home JavaScript -->
    <script src="../scripts/homeLanguage.js" defer></script>
    <script src="../scripts/ocbcHome.js" defer></script>
</head>
<body>

<div class="phone-screen home-page">

    <!-- Top bar -->
    <div class="top-bar">
        <button class="token-button" type="button">
            <img src="../images/ocbc-token.png" alt="" class="token-icon">
            <span data-i18n="ocbcTokens">OCBC Tokens</span>
        </button>
        <button class="logout-link" type="button"
                data-i18n="logout">logout</button>
    </div>

    <!-- Scrollable area -->
    <div class="home-scroll">

        <!-- Hero banner -->
        <div class="hero">
            <img src="../images/ocbc-banner.png"
                 alt="Together, lifting everyone we serve"
                 class="hero-image">
        </div>

        <!-- Quick actions -->
        <div class="quick-actions">
            <div class="quick-actions-main">
                <a href="paynowSent.html" class="action-item">
                    <img src="../images/paynow.png" alt="" class="action-icon">
                    <span>PayNow</span>
                </a>

                <button class="action-item" type="button">
                    <img src="../images/scan-and-pay.png" alt="" class="action-icon">
                    <span data-i18n="scanPay">Scan &amp; Pay</span>
                </button>

                <button class="action-item" type="button">
                    <img src="../images/foreign-exchange.png" alt="" class="action-icon">
                    <span data-i18n="foreignExchange">Foreign Exchange</span>
                </button>
            </div>

            <div class="action-divider"></div>

            <button class="action-item" type="button">
                <img src="../images/Gear-icon.png" alt="" class="action-icon">
                <span data-i18n="customise">Customise</span>
            </button>
        </div>

        <!-- Eye toggle + tabs -->
        <div class="account-tabs">
            <button class="eye-toggle" type="button"
                    aria-label="Show or hide balance"
                    data-i18n-aria="balanceToggle">
                <svg viewBox="0 0 24 24" width="22" height="22"
                     aria-hidden="true">
                    <path d="M12 5C6.5 5 2.7 9 1 12c1.7 3 5.5 7 11 7s9.3-4 11-7c-1.7-3-5.500-7-11-7z" fill="#fff"/>
                    <circle cx="12" cy="12" r="4.200" fill="#111"/>
                    <circle cx="13.300" cy="10.800" r="1.200" fill="#fff"/>
                </svg>
            </button>

            <div class="tab-divider"></div>

            <div class="pill-tabs">
                <button class="pill active" type="button"
                        data-i18n="accounts">Accounts</button>
                <button class="pill" type="button"
                        data-i18n="cards">Cards</button>
                <button class="pill" type="button"
                        data-i18n="investment">Investment</button>
            </div>
        </div>

        <!-- Savings account card -->
        <div class="account-card-wrap">
            <div class="account-card">
                <div class="account-card-dots">
                    <span></span>
                    <span></span>
                </div>

                <h2 id="accountType"></h2>
                <p class="card-number" id="accountNumber"></p>

                <p class="card-balance-label"
                   data-i18n="availableBalance">Available Balance</p>

                <p class="card-balance" id="accountBalance"></p>

                <a href="#" class="view-details"
                   data-i18n="viewDetails">view details</a>
            </div>
        </div>

        <!-- Savings goals / Money insights -->
        <div class="feature-cards">
            <button class="feature-card goals" type="button">
                <h3 data-i18n="savingsGoals">SAVINGS GOALS</h3>
                <p data-i18n="viewGoals">View/manage goals</p>
            </button>

            <button class="feature-card insights" type="button">
                <h3 data-i18n="moneyInsights">MONEY INSIGHTS</h3>
                <p data-i18n="takeControl">Take control</p>
            </button>
        </div>

        <!-- Recent transactions -->
        <div class="transactions">
            <h3 data-i18n="recentTransactions">Recent transactions</h3>
            <div id="transactionList"></div>
        </div>

    </div>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" type="button">
            <img src="../images/house-red.png" alt="" class="nav-icon">
            <span data-i18n="home">Home</span>
        </button>

        <button class="nav-item" type="button">
            <img src="../images/plan.png" alt="" class="nav-icon">
            <span data-i18n="plan">Plan</span>
        </button>

        <button class="nav-item" type="button">
            <img src="../images/pay-transfer.png" alt="" class="nav-icon">
            <span data-i18n="payTransfer">Pay &amp; Transfer</span>
        </button>

        <button class="nav-item" type="button">
            <img src="../images/gift.png" alt="" class="nav-icon">
            <span data-i18n="rewards">Rewards</span>
        </button>

        <a href="more.html" class="nav-item">
            <img src="../images/more.png" alt="" class="nav-icon">
            <span data-i18n="more">More</span>
        </a>
    </nav>

</div>

</body>
</html>
