<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/paynow.css">
        <script src="../scripts/transferStatus.js"></script>
    </head>
    <body>
        <main class="phone-screen">
            <header class="header">
                <button class="back-button" id="backButton" aria-label="Go back">
                    ‹
                </button>
                <span class="guided-label">Guided mode</span>
                <h1>PayNow</h1>
            </header>

            <div class="progress-container">
                <div class="progress-bar active"></div>
                <div class="progress-bar active"></div>
                <div class="progress-bar active"></div>
                <div class="progress-bar">
                    <div class="progress-bar-fill-half"></div>
                </div>
            </div>

            <section class="content">
                <p class="step-title">
                    <span>Step 3 of 4</span> · Processing
                </p>

                <!-- Timeline -->
                <div class="timeline">
                    <!-- Request submitted -->
                    <div class="timeline-item completed">
                        <div class="timeline-icon">
                            <span>&#10003;</span>
                        </div>

                        <div class="timeline-content">
                            <h2>Request submitted</h2>
                            <p>1 Nov 2026, 9:13 AM</p>
                        </div>
                    </div>

                    <!-- Processing -->
                    <div class="timeline-item active">
                        <div class="timeline-icon">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <div class="timeline-content">
                            <h2>Processing</h2>
                            <p>Your request is being processed.</p>
                        </div>
                    </div>

                    <!-- Completed -->
                    <div class="timeline-item pending">
                        <div class="timeline-icon"></div>

                        <div class="timeline-content">
                            <h2>Completed</h2>
                            <p>You'll receive a notification shortly.</p>
                        </div>
                    </div>
                </div>

                <!-- Cancel Button -->
                <div class="button-container">
                    <button type="button" class="red-button" id="cancelButton">
                        Cancel
                    </button>
                </div>
            </section>
        </main>
    </body>
</html>
