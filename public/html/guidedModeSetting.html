<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/setting-pages.css">
        <script type="module" src="../scripts/guidedModeApp.js"></script>
    </head>
    <body>
        <main class="phone-screen">
            <!-- Header -->
            <header class="header">
                <button class="back-button" id="backButton" aria-label="Go back" 
                    onclick="window.location.href = '../html/more.html'">
                    ‹
                </button>
                <h2>Guided Mode</h2>
            </header>

            <!-- Toggle -->
            <div class="toggle-box">
                <img src="../images/guide.png" width="90" height="70">
                <div class="setting-details">
                    <h2>Enable Guided Mode</h2>
                    <div>
                        <p>Receive guidance throughout your banking journey</p>

                    <label class="toggle">
                        <input type="checkbox" id="guidedModeToggle">
                        <span></span>
                    </label>
                    </div>
                </div>
            </div>

            <!-- Message -->
            <div class="setting-message">
                <img src="../images/lightbulb.png" width="100" height="100">
                <div class="message-details">
                    <h2>How It Helps</h2>
                    <p>Get simple and helpful tips when you need them</p>
                </div>
            </div>
        </main>
    </body>
</html>
