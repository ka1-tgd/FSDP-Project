<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FAQ Chatbot Tester</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        input { width: 70%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Test Your FAQ Chatbot</h2>
    <input type="text" id="messageInput" placeholder="Type a question (e.g., How do I transfer money?)..." onkeydown="if(event.key === 'Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>

    <h3>Response:</h3>
    <div id="result">Waiting for your message...</div>

    <script>
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            const resultDiv = document.getElementById('result');

            if (!message) {
                alert('Please type a message first!');
                return;
            }

            resultDiv.innerText = "Thinking...";

            try {
                // FIXED: Pointing to the new /api/chatbot route
                const response = await fetch('/api/chatbot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (data.success) {
                    // Display the direct reply from Gemini/Database
                    let output = `${data.reply}\n`;
                    
                    // Optional: If you want to see which question matched under the hood
                    if (data.matchedQuestion) {
                        output += `\n[Matched FAQ Question: "${data.matchedQuestion}"]`;
                    }
                    
                    resultDiv.innerText = output;
                } else {
                    resultDiv.innerText = "Error: " + (data.error || JSON.stringify(data));
                }

            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerText = "Failed to connect to the server.";
            }
        }
    </script>

</body>
</html>
