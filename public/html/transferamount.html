
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OCBC PayNow - Enter Amount</title>

    <link rel="stylesheet" href="../css/paynow.css">
    <script src="../scripts/transferamount.js" defer></script>
    <link rel="stylesheet" href="../css/voiceAssistance.css">
    <script src="../scripts/voiceAssistance.js" defer></script>
</head>

<body>
    <main class="phone-screen">
        <header class="header">

            <button
                type="button"
                class="back-button"
                id="backButton"
                aria-label="Go back">
                ‹
            </button>

            <span class="guided-label">Guided mode</span>

            <h1>PayNow</h1>

        </header>


        <!-- Progress Indicator -->
        <div class="progress-container">

            <div class="progress-bar active"></div>
            <div class="progress-bar active"></div>
            <div class="progress-bar"></div>
            <div class="progress-bar"></div>

        </div>


        <!-- Main Content -->
        <section class="content">


            <!-- Step Title and Ask OCBC Button -->
            <div class="step-header">

                <p class="step-title">
                    <span>Step 2 of 4</span> · Enter amount
                </p>

                <button
                    type="button"
                    class="ask-ocbc-button"
                    id="askOcbcButton"
                    aria-label="Ask OCBC">

                    <!-- Microphone Icon -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <rect x="9" y="2" width="6" height="13" rx="3"></rect>
                        <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
                        <path d="M12 19v3"></path>
                        <path d="M8 22h8"></path>

                    </svg>

                    <span>Ask OCBC</span>

                </button>

            </div>



            <!-- Recipient Details -->
<div class="recipient-section">
    <p class="section-label">Pay to</p>
    <h2 id="recipientName">Alex Tan</h2>
    <p class="recipient-info" id="recipientInfo">+6587872341 • AIXX TAX</p>
</div>


            <!-- amount selection -->
            <div class="amount-section">
                <div class="amount-input-container">

                    <input
                        type="number"
                        id="amountInput"
                        placeholder="0.00"
                        min="0.01"
                        step="0.01"
                        inputmode="decimal"
                        aria-label="Enter transfer amount">

                    <span>SGD</span>

                </div>


                <!-- Quick amount -->
                <div class="quick-amounts">

                    <button type="button" data-amount="5">$5</button>

                    <button type="button" data-amount="10">$10</button>

                    <button type="button" data-amount="15">$15</button>

                    <button type="button" data-amount="20">$20</button>

                </div>


                <!-- quick amount hint -->
                <p class="quick-hint hidden" id="quickHint">
                    Tap again to remove
                </p>


                <!-- more dropdown -->
                <div class="dropdown-container">
                    <select id="moreAmounts" aria-label="More amounts">
                        <option value="">More amounts</option>
                        <option value="30">$30</option>
                        <option value="50">$50</option>
                        <option value="100">$100</option>
                        <option value="200">$200</option>
                        <option value="500">$500</option>

                    </select>

                </div>

            </div>


            <!-- Daily transfer limit -->
            <p class="daily-limit">

                Daily limit remaining:

                <span id="dailyLimit">3,000.00 SGD</span>

            </p>


            <hr>


            <!-- sender account details -->
            <div class="account-section">

                <p class="section-label">From</p>

                <h3 id="accountType">Savings Account</h3>

                <p class="account-number" id="accountNumber">123-4-567890</p>


                <!-- Show / Hide Balance -->
                <button
                    type="button"
                    class="balance-button"
                    id="balanceButton">
                    <!-- Eye Icon -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="17"
                        height="17"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>

                    <span id="balanceButtonText">
                        Show available balance
                    </span>

                </button>
                <!-- balance available -->
                <p
                    class="available-balance hidden"
                    id="availableBalance"
                    aria-live="polite">
                </p>
            </div>

            <!-- Next Button -->
            <div class="button-container">
                <button
                    type="button"
                    class="red-button"
                    id="nextButton">
                    Next
                </button>
            </div>
        </section>
    </main>
</body>
</html>
