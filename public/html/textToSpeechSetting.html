
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Text to Speech</title>
        <link rel="stylesheet" href="../css/setting-pages.css">
        <script type="module" src="../scripts/textToSpeechSetting.js"></script>
    </head>
    <body>
      <div class="phone-screen tts-page">
            <!-- Header -->
            <header class="header">
                <button class="back-button" id="backButton" aria-label="Go back">
                    ‹
                </button>
                <h1>Text to speech</h1>
            </header>

            <!-- Toggle -->
           <div class="toggle-box">

    <img src="../images/speaker-icon.png"
         alt="Text to Speech"
         class="tts-icon">

    <div class="setting-details">

        <h2>Enable Text to Speech</h2>

        <div class="tts-description-row">

            <p>
                Have the app read out text,
                such as instructions or other details
            </p>

            <label class="toggle">
                <input type="checkbox" id="textToSpeechToggle">
                <span></span>
            </label>

        </div>

    </div>

</div>
            <!-- Message -->
            <div class="setting-message">
                <img src="../images/lightbulb.png" id="messageIcon"
                     width="100" height="100" alt="Information">
                <div class="message-details">
                    <h2 id="messageTitle">How it helps</h2>
                    <p id="messageText">Get audio for better accessibility.</p>
                </div>
            </div>

            <!-- Bottom Nav Bar -->
            <footer>

            </footer>
        </main>
    </body>
</html>
